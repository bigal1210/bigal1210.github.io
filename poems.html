                poem: `Why pick up
your crumbs
when there are ants
who'd love to help

why pull up your bed
when you're
sleeping in it
that same night.

Why pattern
your socks
when your toes
will soon be free

Why plow
the snow
when winter
is soon to slow.

Why play
when we all know
that one day
It will be time to go

Why pry
and force the day
when things will surely
turnout another way.

Why worry
of tomorrow
when the sun
is still not low,

Why worry
for tomorrow
when a new sun
is yet to crow.

A.H.A 9-13-24`

To shape lives
Its hard to know
Which words
Comments
Or stories
Will affect ones charges
But sometimes

In reflection it seems,
Only the professors
I either most loved or hated
Affected my charges.

Snarky comments
Piercing stares.
Like glasses
Between the sun, an ant, and a stone.
Belittled
Challenged
Made to cry.

Curious catch phrases
Etched in my brain,
Like molten rivers
Through soft bed rock.
Once dancing in the dark
This kindling curiosity,
Set ablaze by wonderstruck eyes.

Both
Helped me learn
Both
Made me grow

Stunned
By new ideas
Stupefied
By insurmountable challenges.

Cherish
Those who drive you.
Ignore entirely
Those who do not care.

            },
            {
                id: 'unknown',
                src: "murad.JPG",
                title: "Unknown",
                poem: `Into the unknown the uncharted dark.

Enter the unknown where you're yet to discover
Where you're yet to be flown
What you're yet to uncover

Take a step toward the dark where the world is yet to build
Where you're yet to make your mark,
Where dreams remain unfilled.

March towards the abyss where others have not gone,
Where your subtle kiss would bring others along.
You may find a stairway or doorway or two,
Or have to make one yourself
To find your next clue.

Take a step towards the unknown from where curiosity calls.
What more do you expect from the same wilting walls?

Where it's comfy and calming is where you'll wither in vain.
Just to flame out alone, perhaps theres more to your name.

Solutions arise beyond what is known
Why live in the shadows when ther'es more to be shown.

Why wait for your life if he is waiting for you
Just on the other side of an unknown doorway or two?
3.8.25`
            },
            {
                id: 'One Day Old',
                src: "playing cards.jpg",
                title: "One Day Old",
                poem: `I've known you since you were one day old.

Who did that boy wish to be?
From his eyes again, take a moment to stop and see.

The world from his point of view
And remind yourself, what that boy wished to do.
What do you think he would likely say
about the man that you're gearing up to be one day.

I watched you as you formed your mold.
Did you have a dream, for how this life would unfold?

Remember him as you take your steps,
And take them softly, no need to stress.

Ask yourself again today:
Who do you want to be for this world?

You can choose it's up to you,
How you'll act, how you'll be,
And what you'll do.

I'll watch you while you shut your eyes,
And be with you as you take your final sigh.

How do you think you'll be remembered here,
What dreams do you hope to have on your closing day upon this sphere?

7.20.25`
            },
            {
                id: 'sun-sets-last',
                src: "west facing roads.jpg",
                title: "The Sun Sets Last in San Francisco",
                poem: `To the one traveling the West facing roads.
Where the stones sit heavy along the sides.
Remember us as you peer through the cracks
Of the path we followed, hopeful yet blind.

Can you hear the herds thunder as you're making your way?
Can you see where our tents once stood?
I wish to return on a warm summer day.
Please know that indeed I'd come back if I could.

I've been wondering, is there any sign of me left?
Does she remember me, or miss me at all?
I thought that I, was the one who knew best.
And could make it better, for all of the rest.

So if you're traveling down the West facing roads.
Where the route is covered and tinted with gold.
Remember me, as you walk down;
The path that led to the end of it all.

5.1.26`
            },
            {
                id: 'wild-blue',
                src: "wild-blue.png",
                title: "Wild Blue",
                poem: `Mild Blue
Wild Blue
Shed Blue

Wild Blue

            },
            {
                id: 'i-feel',
                src: "i-feel.jpg",
                title: "I Feel",
                poem: `I feel. That I have something to write.

This thought has been
growing

8.16.26`
            },

                id: 'wild-blue-2',

            {
                id: 'Phantom Regret',
                src: "DawnFM.jpg",
                title: "Phantom Regret",
                poem: `You're tuned to Dawn FM
The middle of nowhere on your dial
So sit back and unpack
You may be here awhile

Now that all future plans have been postponed
And it's time to look back on the things you thought you owned
Do you remember them well?
Were you high or just stoned?

And how many grudges did you take to your grave?
When you weren't liked or followed, how did you behave?
Was it often a dissonant chord you were strumming?
Were you ever in tune with the song life was humming?

If pain's living on when your body's long gone
And your phantom regret hasn't let it go yet
You may not have died in the way that you must
All specters are haunted by their own lack of trust.

When you're all out of time, there's nothing but space
No hunting, no gathering
No nations, no race
And Heaven is closer than those tears on your face
When the purple rain falls
We're all bathed in its grace.

Heaven's for those who let go of regret
And you have to wait here when you're not all there yet
But you could be there by the end of this song

Bang a gong, get it on

And if your broken heart's heavy when you step on the scale

They just open their petals and turn to the light.

Are you listening real close?
Heaven's not that, it's this

God knows life is chaos
But He made one thing true
You gotta unwind your mind
Train your soul to align
And dance 'til you find that divine boogaloo.

In other words
You gotta be Heaven to see Heaven

- Jim Carrey
1/7/22


`
            },
            {
                id: 'Always We Hope',
                src: "laotzu.jpg",
                title: "Always We Hope",
                poem: `Atributed to Lao Tzu. Not sure if it's actually his or not.

                            Always we hope
                            someone else has the answer,
                            some other place will be better,
                            some other time,
                            it will turn out.
This is it.
No one else has the answer,
no other place will be better,
and it has already turned out.

At the centre of your being,
you have the answer:
you know who you are and
you know what you want.

There is no need to run outside
for better seeing,
nor to peer from a window.
Rather abide at the centre of your being:
for the more you leave it,
the less you learn.

Search your heart and see

`
            }
        ];

        let currentImage = 0;

        // Function to find poem by ID
        function getImageIndexById(id) {
            return images.findIndex(image => image.id === id);
        }

        // Slugify a poem ID for use in URL paths
        function slugify(s) {
            return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        // Function to update URL when poem changes
        function updateURL(poemId) {
            const newURL = `/p/${slugify(poemId)}.html`;
            window.history.pushState({ poemId }, '', newURL);
        }

        // Function to update display with current poem
        function updateImage(index) {
            currentImage = index !== undefined ? index : currentImage;
            const poem = images[currentImage];
            document.getElementById('mainImage').src = '/' + encodeURIComponent(poem.src);
            document.getElementById('imageTitle').textContent = poem.title;
            document.getElementById('poemText').textContent = poem.poem;

            // Update URL with current poem ID
            updateURL(poem.id);

            // Update OG meta tags for link previews
            const imageUrl = 'https://alexanderatalla.com/' + encodeURIComponent(poem.src);
            document.title = poem.title;
            document.querySelector('meta[property="og:title"]').setAttribute('content', poem.title);
            document.querySelector('meta[property="og:image"]').setAttribute('content', imageUrl);
            document.querySelector('meta[property="og:url"]').setAttribute('content', 'https://alexanderatalla.com/poems.html?poem=' + poem.id);
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', poem.title);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', imageUrl);
        }

        function previousImage() {
            currentImage = currentImage === 0 ? images.length - 1 : currentImage - 1;
            updateImage();
        }

        function nextImage() {
            currentImage = currentImage === images.length - 1 ? 0 : currentImage + 1;
            updateImage();
        }

        function imageClicked() {
            console.log('Image clicked!');
        }

        // Initialize based on URL parameters
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const poemId = urlParams.get('poem');
            
            if (poemId) {
                const index = getImageIndexById(poemId);
                if (index !== -1) {
                    updateImage(index);
                    return;
                }
            }
            
            // If no valid poem ID in URL, start with first poem
            updateImage(0);
        });

        // Handle browser back/forward buttons
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.poemId) {
                const index = getImageIndexById(event.state.poemId);
                if (index !== -1) {
                    updateImage(index);
                }
            }
        });
    </script>
</body>
</html>
